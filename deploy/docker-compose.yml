services:
  tobacconist:
    build:
      context: ..
      args:
        INSTALL_AGY: ${INSTALL_AGY:-false}
    restart: unless-stopped
    env_file: .env
    volumes:
      - tobacconist-data:/app/data
      # agy's sign-in and settings: survive a rebuild, so login is done once
      - agy-config:/root/.gemini
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tobacconist.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.tobacconist.entrypoints=websecure"
      - "traefik.http.routers.tobacconist.tls.certresolver=le"
      - "traefik.http.services.tobacconist.loadbalancer.server.port=3000"
    networks:
      - containers-net

networks:
  containers-net:
    external: true

volumes:
  tobacconist-data:
  agy-config:
